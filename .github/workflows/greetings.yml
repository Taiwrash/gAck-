name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Hello ${{ github.actor }} for creating first issue, remember to read community guideline"
        pr-message: "${{ github.actor }}, You are a champ for submitting your first PR"
